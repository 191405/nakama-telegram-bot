# fly.toml app configuration file for Nakama Network
# Documentation: https://fly.io/docs/reference/configuration/

app = "nakama-network-bot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "nakama_data"
  destination = "/data"
  initial_size = "1gb"

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/filebot.db"
  TELEGRAM_SESSION_PATH = "/data/streamer_bot"
  HOST = "0.0.0.0"
  PORT = "8080"
  AUTO_DELETE_MINUTES = "10"
  RATE_LIMIT = "30"
  PAGE_SIZE = "8"

# Public HTTP streaming & SPA web routing
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[http_service.concurrency]
  type = "connections"
  hard_limit = 1000
  soft_limit = 800

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[restart]]
  policy = "always"

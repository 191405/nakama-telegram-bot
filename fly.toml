# fly.toml app configuration file generated for nakama-network on 2026-11-17T01:17:08Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'nakama-network'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  AUTO_DELETE_MINUTES = '10'
  DATABASE_URL = 'sqlite+aiosqlite:////data/filebot.db'
  HOST = '0.0.0.0'
  PAGE_SIZE = '8'
  PORT = '8080'
  RATE_LIMIT = '30'
  TELEGRAM_SESSION_PATH = '/data/streamer_bot'

[[mounts]]
  source = 'nakama_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1A2234"/>
      <stop offset="100%" stop-color="#090B10"/>
    </radialGradient>
    
    <!-- Accent Crimson Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A4B"/>
      <stop offset="100%" stop-color="#D3081E"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>

  <!-- Geometric Emblem: Precision N Logo with Angled Cuts -->
  <g filter="url(#subtleShadow)">
    <!-- Left Vertical Column -->
    <path d="M128 384 L128 128 L192 128 L192 384 Z" fill="url(#crimsonGrad)"/>
    
    <!-- Dynamic Diagonal Slash -->
    <path d="M192 128 L320 384 L384 384 L256 128 Z" fill="url(#crimsonGrad)"/>
    
    <!-- Right Vertical Column -->
    <path d="M320 384 L320 128 L384 128 L384 384 Z" fill="url(#crimsonGrad)"/>

    <!-- Geometric Cyan Transmission Node Accent -->
    <circle cx="384" cy="128" r="28" fill="url(#cyanGrad)"/>
    <circle cx="384" cy="128" r="14" fill="#FFFFFF"/>
  </g>
</svg>


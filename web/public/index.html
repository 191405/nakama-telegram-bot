<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nakama Network | Anime & Donghua Vault</title>
  <meta name="description" content="High-performance media vault and streaming platform powered by decentralized storage.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pahe: {
              base: '#0B0D13',
              surface: '#121620',
              card: '#161C2A',
              border: 'rgba(255, 255, 255, 0.08)',
              borderActive: '#FF2A4B',
              crimson: '#FF2A4B',
              crimsonHover: '#D3081E',
              cyan: '#00F0FF',
              textPrimary: '#FFFFFF',
              textSecondary: '#94A3B8',
              textMuted: '#64748B',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0B0D13;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0B0D13;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    .glass-nav {
      background: rgba(11, 13, 19, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-pahe-crimson selection:text-white">

  <!-- ─── Slim Topbar (Animepahe / Lucifer Donghua Style) ───────────────── -->
  <header class="sticky top-0 z-40 glass-nav">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <a href="/" class="flex items-center gap-3 group focus:outline-none flex-shrink-0">
        <svg class="w-8 h-8 transition-transform group-hover:scale-105" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="512" height="512" rx="120" fill="#121620" stroke="rgba(255, 255, 255, 0.1)" stroke-width="8"/>
          <path d="M128 384 L128 128 L192 128 L192 384 Z" fill="#FF2A4B"/>
          <path d="M192 128 L320 384 L384 384 L256 128 Z" fill="#FF2A4B"/>
          <path d="M320 384 L320 128 L384 128 L384 384 Z" fill="#FF2A4B"/>
          <circle cx="384" cy="128" r="28" fill="#00F0FF"/>
          <circle cx="384" cy="128" r="14" fill="#FFFFFF"/>
        </svg>
        <div class="flex flex-col">
          <span class="text-base font-extrabold tracking-wider text-white uppercase">Nakama</span>
          <span class="text-[9px] font-mono tracking-widest text-pahe-cyan uppercase -mt-1 font-semibold">Network</span>
        </div>
      </a>

      <!-- Instant Live Search Bar -->
      <div class="flex-1 max-w-lg relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-pahe-textMuted">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
        <input 
          id="searchInput" 
          type="text" 
          placeholder="Search releases (Press / to search)..." 
          class="w-full pl-9 pr-10 py-2 bg-pahe-surface border border-pahe-border rounded-lg text-sm text-white placeholder-pahe-textMuted focus:outline-none focus:border-pahe-crimson transition-colors"
        >
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
          <kbd class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono text-pahe-textMuted bg-pahe-base border border-pahe-border rounded">/</kbd>
        </div>
      </div>

      <!-- Controls: View Switcher & Telegram -->
      <div class="flex items-center gap-2">
        <!-- View Toggle (Grid vs Pahe List) -->
        <div class="hidden sm:flex items-center bg-pahe-surface border border-pahe-border rounded-lg p-0.5">
          <button id="viewGridBtn" onclick="setViewMode('grid')" class="p-1.5 rounded text-white bg-pahe-card transition-colors" title="Grid View">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
          </button>
          <button id="viewListBtn" onclick="setViewMode('list')" class="p-1.5 rounded text-pahe-textMuted hover:text-white transition-colors" title="Animepahe List View">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>

        <!-- Telegram Vault Deep Link -->
        <a 
          href="https://t.me/NakamaNetworkbot" 
          target="_blank" 
          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-pahe-surface border border-pahe-border text-xs font-semibold text-pahe-textSecondary hover:text-white hover:border-pahe-textMuted transition-colors"
        >
          <svg class="w-4 h-4 text-pahe-cyan" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .37z"/>
          </svg>
          <span class="hidden sm:inline">Telegram Vault</span>
        </a>
      </div>

    </div>
  </header>

  <!-- ─── Main Content ─────────────────────────────────────────────────── -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">

    <!-- Category / Filter Navigation (Lucifer Donghua style) -->
    <div class="flex items-center justify-between border-b border-pahe-border pb-4 mb-6 gap-4">
      <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-1">
        <button onclick="filterCatalog('all')" class="filter-tab active px-3 py-1.5 rounded-md text-xs font-semibold bg-pahe-crimson text-white">
          All Releases
        </button>
        <button onclick="filterCatalog('ONGOING')" class="filter-tab px-3 py-1.5 rounded-md text-xs font-medium text-pahe-textSecondary bg-pahe-surface border border-pahe-border hover:text-white">
          Ongoing
        </button>
        <button onclick="filterCatalog('COMPLETED')" class="filter-tab px-3 py-1.5 rounded-md text-xs font-medium text-pahe-textSecondary bg-pahe-surface border border-pahe-border hover:text-white">
          Completed
        </button>
      </div>

      <div class="text-xs font-mono text-pahe-textMuted flex-shrink-0">
        <span id="seriesCount">0</span> series available
      </div>
    </div>

    <!-- 1. Grid View (Lucifer Donghua / Modern Poster Card) -->
    <div id="catalogGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-5">
      <!-- Loading Skeletons -->
      <div class="animate-pulse bg-pahe-surface rounded-lg aspect-[2/3] border border-pahe-border"></div>
      <div class="animate-pulse bg-pahe-surface rounded-lg aspect-[2/3] border border-pahe-border"></div>
      <div class="animate-pulse bg-pahe-surface rounded-lg aspect-[2/3] border border-pahe-border"></div>
      <div class="animate-pulse bg-pahe-surface rounded-lg aspect-[2/3] border border-pahe-border"></div>
      <div class="animate-pulse bg-pahe-surface rounded-lg aspect-[2/3] border border-pahe-border"></div>
      <div class="animate-pulse bg-pahe-surface rounded-lg aspect-[2/3] border border-pahe-border"></div>
    </div>

    <!-- 2. Dense List View (Animepahe Signature Releases Feed) -->
    <div id="catalogList" class="hidden flex flex-col gap-2">
      <!-- Populated via JS -->
    </div>

  </main>

  <!-- ─── Master Theater Modal (Lucifer Donghua / Animepahe Hybrid) ─────── -->
  <div id="theaterModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/95 backdrop-blur-md p-2 sm:p-4 md:p-6 overflow-y-auto">
    <div class="relative w-full max-w-6xl bg-pahe-surface border border-pahe-border rounded-xl overflow-hidden shadow-2xl flex flex-col max-h-[96vh]">
      
      <!-- Modal Top Bar -->
      <div class="flex items-center justify-between px-4 sm:px-6 py-3 border-b border-pahe-border bg-pahe-base">
        <div class="flex items-center gap-3 truncate">
          <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-pahe-crimson/20 text-pahe-crimson border border-pahe-crimson/40 uppercase">
            NOW PLAYING
          </span>
          <h3 id="modalTitle" class="text-sm sm:text-base font-bold text-white truncate max-w-xl">
            Anime Title
          </h3>
        </div>
        <button id="closeModalBtn" class="text-pahe-textMuted hover:text-white p-1 rounded-md transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Video Player Viewport -->
      <div class="relative aspect-video bg-black flex items-center justify-center w-full">
        <video id="videoElement" class="w-full h-full" controls preload="metadata">
          <source id="videoSource" src="" type="video/mp4">
          HTML5 video streaming is not supported on this browser.
        </video>
      </div>

      <!-- Quick Navigation Bar Under Video (Animepahe / Donghua Signature) -->
      <div class="px-4 sm:px-6 py-3 bg-pahe-base border-b border-pahe-border flex flex-wrap items-center justify-between gap-3 text-xs">
        <div class="flex items-center gap-2">
          <button id="prevEpBtn" class="px-3 py-1.5 rounded bg-pahe-surface border border-pahe-border text-pahe-textSecondary hover:text-white disabled:opacity-40 transition-colors">
            Previous
          </button>
          <span id="currentEpLabel" class="font-mono text-pahe-cyan font-bold px-2">
            EP 01
          </span>
          <button id="nextEpBtn" class="px-3 py-1.5 rounded bg-pahe-surface border border-pahe-border text-pahe-textSecondary hover:text-white disabled:opacity-40 transition-colors">
            Next
          </button>
        </div>

        <div class="flex items-center gap-2">
          <span class="text-pahe-textMuted font-mono">1080p FHD</span>
          <span class="text-pahe-border">•</span>
          <a 
            id="modalTgLink" 
            href="#" 
            target="_blank" 
            class="px-3 py-1.5 rounded bg-pahe-surface border border-pahe-border text-pahe-cyan hover:border-pahe-cyan transition-colors"
          >
            Forward to Telegram
          </a>
        </div>
      </div>

      <!-- Episode Grid Selector (Lucifer Donghua Numbered Pills) -->
      <div class="p-4 sm:p-6 overflow-y-auto custom-scrollbar flex-1 bg-pahe-surface">
        <div class="flex items-center justify-between mb-3">
          <h4 class="text-xs font-bold text-white uppercase tracking-wider">Select Episode</h4>
          <span id="epCountBadge" class="text-[11px] font-mono text-pahe-textMuted">0 Episodes</span>
        </div>
        
        <!-- Numbered Pill Grid -->
        <div id="episodeGridContainer" class="grid grid-cols-6 sm:grid-cols-10 md:grid-cols-12 lg:grid-cols-16 gap-2">
          <!-- Populated by JS -->
        </div>

        <!-- Series Synopsis & Details -->
        <div class="mt-6 pt-4 border-t border-pahe-border">
          <p id="modalDesc" class="text-xs text-pahe-textSecondary leading-relaxed">
            <!-- Synopsis -->
          </p>
        </div>
      </div>

    </div>
  </div>

  <!-- ─── Footer ────────────────────────────────────────────────────────── -->
  <footer class="border-t border-pahe-border py-8 mt-16 text-center text-xs text-pahe-textMuted bg-pahe-base">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="font-extrabold text-white">NAKAMA NETWORK</span>
        <span>•</span>
        <span>Anime & Donghua Vault</span>
      </div>
      <div>
        <span>Storage Vault: Telegram Storage Channel</span>
        <span class="mx-2">•</span>
        <span>Metadata: AniList API</span>
      </div>
    </div>
  </footer>

  <!-- ─── Client Application Logic ─────────────────────────────────────── -->
  <script>
    let currentCatalog = [];
    let displayedCatalog = [];
    let activeFilter = 'all';
    let currentViewMode = 'grid';
    let activeSeriesData = null;
    let activeEpisodeIndex = 0;

    // DOM References
    const catalogGrid = document.getElementById('catalogGrid');
    const catalogList = document.getElementById('catalogList');
    const seriesCount = document.getElementById('seriesCount');
    const searchInput = document.getElementById('searchInput');
    const theaterModal = document.getElementById('theaterModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const videoElement = document.getElementById('videoElement');
    const videoSource = document.getElementById('videoSource');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const currentEpLabel = document.getElementById('currentEpLabel');
    const epCountBadge = document.getElementById('epCountBadge');
    const episodeGridContainer = document.getElementById('episodeGridContainer');
    const prevEpBtn = document.getElementById('prevEpBtn');
    const nextEpBtn = document.getElementById('nextEpBtn');
    const modalTgLink = document.getElementById('modalTgLink');
    const viewGridBtn = document.getElementById('viewGridBtn');
    const viewListBtn = document.getElementById('viewListBtn');

    // 1. Fetch Catalog
    async function loadCatalog() {
      try {
        const resp = await fetch('/api/catalog');
        const data = await resp.json();
        if (data.status === 'ok') {
          currentCatalog = data.catalog;
          applyFilterAndRender();
        }
      } catch (err) {
        console.error('Failed to load catalog:', err);
        catalogGrid.innerHTML = `
          <div class="col-span-full py-16 text-center text-xs text-pahe-textMuted">
            Failed to connect to the Nakama API Gateway.
          </div>
        `;
      }
    }

    // 2. View Mode Switcher (Grid vs Animepahe List)
    function setViewMode(mode) {
      currentViewMode = mode;
      if (mode === 'grid') {
        catalogGrid.classList.remove('hidden');
        catalogList.classList.add('hidden');
        viewGridBtn.className = 'p-1.5 rounded text-white bg-pahe-card transition-colors';
        viewListBtn.className = 'p-1.5 rounded text-pahe-textMuted hover:text-white transition-colors';
      } else {
        catalogGrid.classList.add('hidden');
        catalogList.classList.remove('hidden');
        viewListBtn.className = 'p-1.5 rounded text-white bg-pahe-card transition-colors';
        viewGridBtn.className = 'p-1.5 rounded text-pahe-textMuted hover:text-white transition-colors';
      }
      applyFilterAndRender();
    }

    // 3. Filter Catalog
    function filterCatalog(filter) {
      activeFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(b => {
        b.className = 'filter-tab px-3 py-1.5 rounded-md text-xs font-medium text-pahe-textSecondary bg-pahe-surface border border-pahe-border hover:text-white';
      });
      event.target.className = 'filter-tab active px-3 py-1.5 rounded-md text-xs font-semibold bg-pahe-crimson text-white';
      applyFilterAndRender();
    }

    function applyFilterAndRender() {
      let filtered = [...currentCatalog];
      if (activeFilter !== 'all') {
        filtered = filtered.filter(item => item.status === activeFilter);
      }

      const q = searchInput.value.toLowerCase().trim();
      if (q) {
        filtered = filtered.filter(item => item.name.toLowerCase().includes(q));
      }

      displayedCatalog = filtered;
      seriesCount.textContent = displayedCatalog.length;

      if (currentViewMode === 'grid') {
        renderGridView(displayedCatalog);
      } else {
        renderListView(displayedCatalog);
      }
    }

    // 4. Render Grid View (Lucifer Donghua style)
    function renderGridView(items) {
      if (items.length === 0) {
        catalogGrid.innerHTML = `<div class="col-span-full py-16 text-center text-xs text-pahe-textMuted">No releases found matching query.</div>`;
        return;
      }

      catalogGrid.innerHTML = items.map(item => {
        const poster = item.cover_image || '';
        const statusBadge = item.status === 'COMPLETED' ? 'bg-green-600/80' : 'bg-pahe-crimson/80';
        
        return `
          <div 
            onclick="openSeries('${encodeURIComponent(item.name)}')" 
            class="group cursor-pointer bg-pahe-surface rounded-lg overflow-hidden border border-pahe-border hover:border-pahe-crimson transition-all duration-200 flex flex-col"
          >
            <div class="aspect-[2/3] bg-pahe-card relative overflow-hidden">
              ${poster ? `<img src="${poster}" alt="${escapeHtml(item.name)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">` : `<div class="w-full h-full flex items-center justify-center p-3 text-center text-[11px] font-mono text-pahe-textMuted">${escapeHtml(item.name)}</div>`}
              <div class="absolute inset-0 bg-gradient-to-t from-pahe-base via-transparent to-transparent opacity-90"></div>
              
              <!-- Badges -->
              <div class="absolute top-2 left-2 flex gap-1">
                <span class="px-1.5 py-0.5 rounded text-[9px] font-mono font-bold text-white ${statusBadge}">
                  ${item.status}
                </span>
                <span class="px-1.5 py-0.5 rounded text-[9px] font-mono font-bold bg-black/70 text-pahe-cyan border border-white/10">
                  SUB
                </span>
              </div>
              <div class="absolute top-2 right-2">
                <span class="px-1.5 py-0.5 rounded text-[9px] font-mono text-white bg-black/70 border border-white/10">
                  1080p
                </span>
              </div>

              <!-- Episode Count at bottom -->
              <div class="absolute bottom-2 left-2 right-2 flex items-center justify-between text-[11px] font-mono font-bold">
                <span class="text-white drop-shadow">EP ${item.total_episodes}</span>
                ${item.score ? `<span class="text-pahe-cyan">★ ${(item.score / 10).toFixed(1)}</span>` : ''}
              </div>
            </div>

            <div class="p-2.5 flex-1 flex flex-col justify-between">
              <h3 class="text-xs font-semibold text-white line-clamp-2 group-hover:text-pahe-crimson transition-colors">
                ${escapeHtml(item.name)}
              </h3>
              <div class="flex items-center justify-between text-[10px] text-pahe-textMuted font-mono mt-2">
                <span>${item.year || '2026'}</span>
                <span>${item.total_downloads} plays</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 5. Render Dense Animepahe List View
    function renderListView(items) {
      if (items.length === 0) {
        catalogList.innerHTML = `<div class="py-16 text-center text-xs text-pahe-textMuted">No releases found.</div>`;
        return;
      }

      catalogList.innerHTML = items.map(item => `
        <div 
          onclick="openSeries('${encodeURIComponent(item.name)}')" 
          class="cursor-pointer bg-pahe-surface hover:bg-pahe-card border border-pahe-border hover:border-pahe-crimson/50 rounded-lg p-3 flex items-center justify-between gap-4 transition-colors"
        >
          <div class="flex items-center gap-3 truncate">
            <span class="px-2 py-1 rounded text-xs font-mono font-bold bg-pahe-crimson/20 text-pahe-crimson border border-pahe-crimson/30">
              EP ${item.total_episodes}
            </span>
            <div class="truncate">
              <h4 class="text-xs sm:text-sm font-semibold text-white truncate hover:text-pahe-crimson transition-colors">
                ${escapeHtml(item.name)}
              </h4>
              <div class="flex items-center gap-2 text-[10px] text-pahe-textMuted font-mono mt-0.5">
                <span>Japanese Audio</span>
                <span>•</span>
                <span>English Subtitles</span>
                <span>•</span>
                <span>1080p FHD</span>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-3 flex-shrink-0">
            <span class="hidden md:inline-block text-[11px] font-mono text-pahe-textMuted">
              ${item.total_downloads} plays
            </span>
            <button class="px-3 py-1.5 rounded bg-pahe-crimson hover:bg-pahe-crimsonHover text-white text-xs font-semibold transition-colors">
              Watch
            </button>
          </div>
        </div>
      `).join('');
    }

    // 6. Open Series Theater Modal
    async function openSeries(encodedName) {
      try {
        const resp = await fetch(`/api/series/${encodedName}`);
        const data = await resp.json();
        if (data.status === 'ok') {
          activeSeriesData = data;
          modalTitle.textContent = data.series;
          modalDesc.textContent = data.description || 'Full series archive ready for streaming via Telegram media vault.';
          epCountBadge.textContent = `${data.total_episodes} Episodes`;
          modalTgLink.href = `https://t.me/NakamaNetworkbot?start=search_${encodedName}`;

          // Render Numbered Pill Grid (Lucifer Donghua style)
          episodeGridContainer.innerHTML = data.episodes.map((ep, idx) => `
            <button 
              id="epPill_${idx}" 
              onclick="playEpisodeIndex(${idx})" 
              class="ep-pill py-2 text-xs font-mono font-bold rounded bg-pahe-base border border-pahe-border hover:border-pahe-crimson transition-colors text-white"
            >
              ${ep.episode !== null ? ep.episode : (idx + 1)}
            </button>
          `).join('');

          // Auto-play first episode
          if (data.episodes.length > 0) {
            playEpisodeIndex(0);
          }

          theaterModal.classList.remove('hidden');
        }
      } catch (err) {
        console.error('Failed to open series:', err);
      }
    }

    // 7. Play Episode by Index
    function playEpisodeIndex(idx) {
      if (!activeSeriesData || !activeSeriesData.episodes[idx]) return;
      activeEpisodeIndex = idx;
      const ep = activeSeriesData.episodes[idx];

      modalTitle.textContent = ep.file_name;
      currentEpLabel.textContent = `EP ${ep.episode !== null ? ep.episode : (idx + 1)}`;
      videoSource.src = `/stream/${ep.id}`;
      videoElement.load();
      videoElement.play().catch(() => {});

      // Update active pill highlight
      document.querySelectorAll('.ep-pill').forEach(p => {
        p.className = 'ep-pill py-2 text-xs font-mono font-bold rounded bg-pahe-base border border-pahe-border hover:border-pahe-crimson transition-colors text-white';
      });
      const activePill = document.getElementById(`epPill_${idx}`);
      if (activePill) {
        activePill.className = 'ep-pill py-2 text-xs font-mono font-bold rounded bg-pahe-crimson border border-pahe-crimson text-white';
      }

      // Prev/Next button states
      prevEpBtn.disabled = idx === 0;
      nextEpBtn.disabled = idx >= activeSeriesData.episodes.length - 1;
    }

    // Prev / Next Listeners
    prevEpBtn.onclick = () => {
      if (activeEpisodeIndex > 0) playEpisodeIndex(activeEpisodeIndex - 1);
    };
    nextEpBtn.onclick = () => {
      if (activeSeriesData && activeEpisodeIndex < activeSeriesData.episodes.length - 1) {
        playEpisodeIndex(activeEpisodeIndex + 1);
      }
    };

    // 8. Close Modal
    closeModalBtn.addEventListener('click', () => {
      videoElement.pause();
      videoSource.src = '';
      theaterModal.classList.add('hidden');
    });

    // 9. Search listener
    searchInput.addEventListener('input', () => {
      applyFilterAndRender();
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape' && !theaterModal.classList.contains('hidden')) {
        closeModalBtn.click();
      }
      if (!theaterModal.classList.contains('hidden')) {
        if (e.key === ']' && !nextEpBtn.disabled) nextEpBtn.click();
        if (e.key === '[' && !prevEpBtn.disabled) prevEpBtn.click();
      }
    });

    // Helper: Escape HTML
    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Initialize
    loadCatalog();
  </script>
</body>
</html>

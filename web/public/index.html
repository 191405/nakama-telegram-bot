<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nakama Network</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ───── Reset ───── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    input { font: inherit; }

    /* ───── Theme: Midnight (Default) ───── */
    :root, [data-theme="midnight"] {
      --bg-page: #08090E;
      --bg-surface: #0F1119;
      --bg-card: #151822;
      --bg-card-hover: #1B1F2C;
      --bg-input: #12141E;
      --border: rgba(255,255,255,0.07);
      --border-active: #6366F1;
      --accent: #818CF8;
      --accent-hover: #6366F1;
      --accent-subtle: rgba(99,102,241,0.12);
      --text-1: #F1F5F9;
      --text-2: #94A3B8;
      --text-3: #475569;
      --badge-ongoing: #22C55E;
      --badge-completed: #6366F1;
      --danger: #EF4444;
      --shadow-card: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* ───── Theme: Crimson ───── */
    [data-theme="crimson"] {
      --bg-page: #0A0708;
      --bg-surface: #140E10;
      --bg-card: #1C1316;
      --bg-card-hover: #24181C;
      --bg-input: #140E10;
      --border: rgba(255,255,255,0.06);
      --border-active: #E11D48;
      --accent: #FB7185;
      --accent-hover: #E11D48;
      --accent-subtle: rgba(225,29,72,0.12);
      --text-1: #FFF1F2;
      --text-2: #FDA4AF;
      --text-3: #9F1239;
      --badge-ongoing: #FB923C;
      --badge-completed: #E11D48;
      --danger: #EF4444;
      --shadow-card: 0 2px 8px rgba(0,0,0,0.5);
    }

    /* ───── Theme: Ocean ───── */
    [data-theme="ocean"] {
      --bg-page: #060A0E;
      --bg-surface: #0B1219;
      --bg-card: #101A24;
      --bg-card-hover: #15222F;
      --bg-input: #0B1219;
      --border: rgba(255,255,255,0.06);
      --border-active: #0891B2;
      --accent: #22D3EE;
      --accent-hover: #0891B2;
      --accent-subtle: rgba(8,145,178,0.12);
      --text-1: #F0FDFA;
      --text-2: #67E8F9;
      --text-3: #155E75;
      --badge-ongoing: #34D399;
      --badge-completed: #0891B2;
      --danger: #F87171;
      --shadow-card: 0 2px 8px rgba(0,0,0,0.5);
    }

    body {
      background: var(--bg-page);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ───── Utilities ───── */
    .mono { font-family: 'JetBrains Mono', monospace; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

    /* ───── Layout ───── */
    .container { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
    @media (min-width: 768px) { .container { padding: 0 32px; } }

    /* ───── Navigation ───── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(8,9,14,0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      height: 60px;
    }
    .nav-inner {
      max-width: 1280px; margin: 0 auto; padding: 0 20px;
      height: 100%; display: flex; align-items: center; gap: 16px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .nav-brand svg { width: 32px; height: 32px; }
    .nav-brand-text { display: flex; flex-direction: column; }
    .nav-brand-name { font-size: 15px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-1); line-height: 1.1; }
    .nav-brand-sub { font-size: 9px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); line-height: 1; }

    .nav-search {
      flex: 1; max-width: 420px; position: relative;
    }
    .nav-search input {
      width: 100%; padding: 8px 12px 8px 36px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text-1); font-size: 13px;
      transition: border-color 0.15s;
      outline: none;
    }
    .nav-search input::placeholder { color: var(--text-3); }
    .nav-search input:focus { border-color: var(--accent); }
    .nav-search-icon {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--text-3); pointer-events: none;
    }

    .nav-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }

    .theme-btn {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-2); transition: all 0.15s;
    }
    .theme-btn:hover { background: var(--bg-card-hover); color: var(--text-1); }
    .theme-btn.active { border-color: var(--accent); color: var(--accent); }

    .nav-link {
      padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
      color: var(--text-2); background: var(--bg-card); border: 1px solid var(--border);
      transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
    }
    .nav-link:hover { color: var(--text-1); border-color: var(--text-3); }

    /* ───── Page Sections ───── */
    .page { display: none; flex: 1; }
    .page.active { display: block; }

    /* ───── Section Headers ───── */
    .section-header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 16px; padding-top: 32px;
    }
    .section-title { font-size: 16px; font-weight: 700; color: var(--text-1); }
    .section-link {
      font-size: 12px; font-weight: 600; color: var(--accent);
      cursor: pointer; transition: opacity 0.15s;
    }
    .section-link:hover { opacity: 0.8; }

    /* ───── Poster Grid ───── */
    .poster-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    }
    @media (min-width: 640px) { .poster-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
    @media (min-width: 1024px) { .poster-grid { grid-template-columns: repeat(6, 1fr); } }

    .poster-card {
      border-radius: 10px; overflow: hidden; cursor: pointer;
      background: var(--bg-card); border: 1px solid var(--border);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .poster-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-active);
      box-shadow: var(--shadow-card);
    }
    .poster-card-image {
      aspect-ratio: 2/3; background: var(--bg-surface);
      position: relative; overflow: hidden;
    }
    .poster-card-image img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.3s;
    }
    .poster-card:hover .poster-card-image img { transform: scale(1.05); }
    .poster-card-image .gradient-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, var(--bg-card), transparent 50%);
    }
    .poster-card-image .placeholder-text {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 12px; text-align: center; font-size: 11px; color: var(--text-3);
    }
    .poster-card-badges {
      position: absolute; top: 8px; left: 8px; right: 8px;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .badge {
      padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-ongoing { background: var(--badge-ongoing); color: #fff; }
    .badge-completed { background: var(--badge-completed); color: #fff; }
    .badge-quality { background: rgba(0,0,0,0.7); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
    .poster-card-ep {
      position: absolute; bottom: 8px; left: 8px;
      font-size: 11px; font-weight: 700; color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .poster-card-score {
      position: absolute; bottom: 8px; right: 8px;
      font-size: 11px; font-weight: 700; color: var(--accent);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .poster-card-info { padding: 10px; }
    .poster-card-title {
      font-size: 12px; font-weight: 600; color: var(--text-1);
      transition: color 0.15s;
    }
    .poster-card:hover .poster-card-title { color: var(--accent); }
    .poster-card-meta { margin-top: 4px; font-size: 10px; color: var(--text-3); display: flex; gap: 8px; }

    /* ───── Series Detail Page ───── */
    .detail-banner {
      position: relative; height: 280px; overflow: hidden;
      background: var(--bg-surface);
    }
    @media (min-width: 768px) { .detail-banner { height: 340px; } }
    .detail-banner img { width: 100%; height: 100%; object-fit: cover; }
    .detail-banner-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, var(--bg-page) 0%, transparent 40%),
                  linear-gradient(to right, var(--bg-page) 0%, transparent 60%);
    }
    .detail-content {
      position: relative; margin-top: -120px; z-index: 10;
    }
    .detail-layout { display: flex; gap: 24px; align-items: flex-start; }
    @media (max-width: 767px) { .detail-layout { flex-direction: column; align-items: center; text-align: center; } }
    .detail-poster {
      width: 180px; flex-shrink: 0; border-radius: 10px;
      overflow: hidden; border: 2px solid var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5); background: var(--bg-card);
    }
    .detail-poster img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
    .detail-info { flex: 1; padding-top: 8px; }
    .detail-title { font-size: 24px; font-weight: 800; color: var(--text-1); line-height: 1.2; }
    @media (min-width: 768px) { .detail-title { font-size: 30px; } }
    .detail-meta-row {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center;
    }
    @media (max-width: 767px) { .detail-meta-row { justify-content: center; } }
    .detail-tag {
      padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
      background: var(--accent-subtle); color: var(--accent);
    }
    .detail-stat {
      font-size: 12px; color: var(--text-2);
    }
    .detail-synopsis {
      margin-top: 16px; font-size: 13px; line-height: 1.7; color: var(--text-2);
      max-width: 640px;
    }
    .detail-actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    @media (max-width: 767px) { .detail-actions { justify-content: center; } }

    .btn-primary {
      padding: 10px 24px; border-radius: 8px; font-size: 13px; font-weight: 700;
      background: var(--accent-hover); color: #fff; transition: all 0.15s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary:hover { background: var(--accent); }
    .btn-secondary {
      padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600;
      background: var(--bg-card); color: var(--text-2); border: 1px solid var(--border);
      transition: all 0.15s; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-secondary:hover { color: var(--text-1); border-color: var(--text-3); }

    /* ───── Episodes Table ───── */
    .episodes-section { margin-top: 40px; padding-bottom: 40px; }
    .episode-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; border-radius: 8px; background: var(--bg-card);
      border: 1px solid var(--border); margin-bottom: 6px;
      transition: border-color 0.15s, background 0.15s; cursor: pointer;
    }
    .episode-row:hover { background: var(--bg-card-hover); border-color: var(--border-active); }
    .episode-row-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .episode-num {
      width: 40px; text-align: center; font-size: 13px; font-weight: 700;
      color: var(--accent); flex-shrink: 0;
    }
    .episode-name { font-size: 13px; color: var(--text-1); min-width: 0; }
    .episode-row-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .episode-size { font-size: 11px; color: var(--text-3); }
    .episode-play-btn {
      padding: 6px 16px; border-radius: 6px; font-size: 11px; font-weight: 700;
      background: var(--accent-hover); color: #fff; transition: background 0.15s;
    }
    .episode-play-btn:hover { background: var(--accent); }
    .episode-dl-btn {
      padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: 600;
      background: var(--bg-surface); color: var(--text-2); border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .episode-dl-btn:hover { color: var(--text-1); border-color: var(--text-3); }

    /* ───── Watch Page ───── */
    .watch-player { background: #000; aspect-ratio: 16/9; max-height: 70vh; }
    .watch-player video { width: 100%; height: 100%; }
    .watch-info { padding: 20px 0; }
    .watch-title { font-size: 18px; font-weight: 700; color: var(--text-1); }
    .watch-nav { margin-top: 16px; display: flex; gap: 8px; }

    /* ───── Footer ───── */
    .footer {
      margin-top: auto; border-top: 1px solid var(--border);
      padding: 24px 20px; text-align: center; font-size: 11px; color: var(--text-3);
    }

    /* ───── Empty State ───── */
    .empty-state { padding: 60px 20px; text-align: center; color: var(--text-3); font-size: 13px; }

    /* ───── Loading Skeleton ───── */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 10px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ───── Scrollbar ───── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-page); }
    ::-webkit-scrollbar-thumb { background: var(--bg-card-hover); border-radius: 3px; }
  </style>
</head>
<body>

  <!-- ═══════ NAVIGATION ═══════ -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="#/" class="nav-brand">
        <svg viewBox="0 0 512 512" fill="none"><rect width="512" height="512" rx="120" fill="var(--bg-card)"/><path d="M128 384V128h64v256z" fill="var(--accent)"/><path d="M192 128l128 256h64L256 128z" fill="var(--accent)"/><path d="M320 384V128h64v256z" fill="var(--accent)"/><circle cx="384" cy="128" r="22" fill="var(--accent)" opacity="0.5"/></svg>
        <span class="nav-brand-text">
          <span class="nav-brand-name">Nakama</span>
          <span class="nav-brand-sub">Network</span>
        </span>
      </a>

      <div class="nav-search">
        <svg class="nav-search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="searchInput" type="text" placeholder="Search anime titles...">
      </div>

      <div class="nav-actions">
        <button class="theme-btn active" data-theme-set="midnight" title="Midnight theme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
        <button class="theme-btn" data-theme-set="crimson" title="Crimson theme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
        </button>
        <button class="theme-btn" data-theme-set="ocean" title="Ocean theme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
        <a href="https://t.me/NakamaNetworkbot" target="_blank" rel="noopener" class="nav-link">
          Telegram
        </a>
      </div>
    </div>
  </nav>

  <!-- ═══════ PAGE: HOME ═══════ -->
  <div id="page-home" class="page active">
    <div class="container">

      <!-- Latest Releases -->
      <div class="section-header">
        <span class="section-title">Latest Releases</span>
      </div>
      <div id="latestGrid" class="poster-grid">
        <div class="skeleton" style="aspect-ratio:2/3"></div>
        <div class="skeleton" style="aspect-ratio:2/3"></div>
        <div class="skeleton" style="aspect-ratio:2/3"></div>
        <div class="skeleton" style="aspect-ratio:2/3"></div>
        <div class="skeleton" style="aspect-ratio:2/3"></div>
        <div class="skeleton" style="aspect-ratio:2/3"></div>
      </div>

      <!-- Full Catalog -->
      <div class="section-header">
        <span class="section-title">Anime Vault</span>
        <span id="catalogCount" class="section-link mono" style="cursor:default"></span>
      </div>

      <!-- Filter Row -->
      <div style="display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;">
        <button class="filter-btn active" onclick="setCatalogFilter('all',this)">All</button>
        <button class="filter-btn" onclick="setCatalogFilter('ONGOING',this)">Ongoing</button>
        <button class="filter-btn" onclick="setCatalogFilter('COMPLETED',this)">Completed</button>
      </div>
      <style>
        .filter-btn {
          padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
          background: var(--bg-card); border: 1px solid var(--border); color: var(--text-2);
          transition: all 0.15s;
        }
        .filter-btn:hover { color: var(--text-1); }
        .filter-btn.active { background: var(--accent-hover); color: #fff; border-color: var(--accent-hover); }
      </style>

      <div id="catalogGrid" class="poster-grid"></div>
      <div style="height:48px"></div>
    </div>
  </div>

  <!-- ═══════ PAGE: SEARCH RESULTS ═══════ -->
  <div id="page-search" class="page">
    <div class="container">
      <div class="section-header">
        <span class="section-title">Search Results</span>
        <span id="searchQuery" class="section-link mono" style="cursor:default"></span>
      </div>
      <div id="searchResults" class="poster-grid"></div>
      <div style="height:48px"></div>
    </div>
  </div>

  <!-- ═══════ PAGE: SERIES DETAIL ═══════ -->
  <div id="page-detail" class="page">
    <div id="detailBanner" class="detail-banner">
      <img id="detailBannerImg" src="" alt="">
      <div class="detail-banner-overlay"></div>
    </div>
    <div class="container detail-content">
      <div class="detail-layout">
        <div class="detail-poster">
          <img id="detailPoster" src="" alt="">
        </div>
        <div class="detail-info">
          <h1 id="detailTitle" class="detail-title"></h1>
          <div id="detailMeta" class="detail-meta-row"></div>
          <p id="detailSynopsis" class="detail-synopsis"></p>
          <div class="detail-actions">
            <button id="detailPlayBtn" class="btn-primary">Play First Episode</button>
            <a id="detailTgLink" href="#" target="_blank" class="btn-secondary">Get via Telegram</a>
          </div>
        </div>
      </div>

      <div class="episodes-section">
        <div class="section-header" style="padding-top:0">
          <span class="section-title">Episodes</span>
          <span id="detailEpCount" class="mono" style="font-size:12px; color:var(--text-3)"></span>
        </div>
        <div id="episodesList"></div>
      </div>
    </div>
  </div>

  <!-- ═══════ PAGE: WATCH ═══════ -->
  <div id="page-watch" class="page">
    <div class="watch-player">
      <video id="watchVideo" controls preload="metadata">
        <source id="watchSource" src="" type="video/mp4">
      </video>
    </div>
    <div class="container watch-info">
      <h2 id="watchTitle" class="watch-title"></h2>
      <div id="watchSeriesLink" style="margin-top:6px; font-size:12px; color:var(--text-2); cursor:pointer;"></div>
      <div class="watch-nav">
        <button id="watchPrev" class="btn-secondary" disabled>Previous</button>
        <button id="watchNext" class="btn-secondary" disabled>Next</button>
        <a id="watchTgBtn" href="#" target="_blank" class="btn-secondary" style="margin-left:auto">Download via Telegram</a>
      </div>
    </div>
  </div>

  <!-- ═══════ FOOTER ═══════ -->
  <footer class="footer">
    <div>Nakama Network &mdash; Decentralised media vault &middot; Metadata via AniList &middot; Storage via Telegram</div>
  </footer>

  <!-- ═══════ APPLICATION LOGIC ═══════ -->
  <script>
    // --- State ---
    let catalog = [];
    let catalogFilter = 'all';
    let currentSeries = null; // full series response data when on detail page

    // --- DOM ---
    const $ = (id) => document.getElementById(id);

    // --- Themes ---
    document.querySelectorAll('[data-theme-set]').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.themeSet;
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('nakama-theme', t);
        document.querySelectorAll('[data-theme-set]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
    (function loadTheme() {
      const saved = localStorage.getItem('nakama-theme') || 'midnight';
      document.documentElement.setAttribute('data-theme', saved);
      document.querySelectorAll('[data-theme-set]').forEach(b => {
        b.classList.toggle('active', b.dataset.themeSet === saved);
      });
    })();

    // --- Router ---
    function navigate(hash) {
      if (location.hash !== hash) location.hash = hash;
    }

    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const el = $(id);
      if (el) el.classList.add('active');
      window.scrollTo(0, 0);
    }

    async function handleRoute() {
      const hash = location.hash || '#/';
      if (hash === '#/' || hash === '#') {
        showPage('page-home');
        if (catalog.length === 0) await loadCatalog();
      } else if (hash.startsWith('#/anime/')) {
        const name = decodeURIComponent(hash.replace('#/anime/', ''));
        showPage('page-detail');
        await loadSeriesDetail(name);
      } else if (hash.startsWith('#/watch/')) {
        const parts = hash.replace('#/watch/', '').split('/');
        const fileId = parseInt(parts[0]);
        const seriesName = parts[1] ? decodeURIComponent(parts[1]) : null;
        showPage('page-watch');
        startPlayback(fileId, seriesName);
      } else if (hash.startsWith('#/search/')) {
        const q = decodeURIComponent(hash.replace('#/search/', ''));
        showPage('page-search');
        await runSearch(q);
      } else {
        showPage('page-home');
      }
    }

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('load', handleRoute);

    // --- Data Loading ---

    async function loadCatalog() {
      try {
        const resp = await fetch('/api/catalog');
        const data = await resp.json();
        if (data.status === 'ok') {
          catalog = data.catalog;
          renderCatalog();
          renderLatest();
        }
      } catch (e) {
        $('catalogGrid').innerHTML = '<div class="empty-state">Could not load catalog. Is the server running?</div>';
      }
    }

    function renderCatalog() {
      let items = catalog;
      if (catalogFilter !== 'all') {
        items = items.filter(i => i.status === catalogFilter);
      }
      $('catalogCount').textContent = items.length + ' series';
      $('catalogGrid').innerHTML = items.length ? items.map(posterCardHtml).join('') : '<div class="empty-state">No series match the current filter.</div>';
    }

    function renderLatest() {
      // Show the first 6 from catalog sorted by latest_file_id descending as a proxy for recency
      const sorted = [...catalog].sort((a, b) => (b.latest_file_id || 0) - (a.latest_file_id || 0)).slice(0, 6);
      $('latestGrid').innerHTML = sorted.length ? sorted.map(posterCardHtml).join('') : '<div class="empty-state">No releases yet.</div>';
    }

    function setCatalogFilter(filter, btn) {
      catalogFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCatalog();
    }

    function posterCardHtml(item) {
      const img = item.cover_image
        ? `<img src="${item.cover_image}" alt="${esc(item.display_title || item.name)}" loading="lazy">`
        : `<div class="placeholder-text mono">${esc(item.name)}</div>`;

      const statusCls = item.status === 'COMPLETED' ? 'badge-completed' : 'badge-ongoing';
      const score = item.score ? (item.score / 10).toFixed(1) : '';

      return `
        <div class="poster-card" onclick="navigate('#/anime/${encodeURIComponent(item.name)}')">
          <div class="poster-card-image">
            ${img}
            <div class="gradient-overlay"></div>
            <div class="poster-card-badges">
              <span class="badge ${statusCls}">${item.status}</span>
              <span class="badge badge-quality mono">1080p</span>
            </div>
            <span class="poster-card-ep mono">EP ${item.total_episodes}</span>
            ${score ? `<span class="poster-card-score mono">${score}</span>` : ''}
          </div>
          <div class="poster-card-info">
            <div class="poster-card-title line-clamp-2">${esc(item.display_title || item.name)}</div>
            <div class="poster-card-meta mono">
              ${item.year ? `<span>${item.year}</span>` : ''}
              ${item.genres.length ? `<span>${item.genres[0]}</span>` : ''}
            </div>
          </div>
        </div>`;
    }

    // --- Series Detail ---

    async function loadSeriesDetail(name) {
      $('detailTitle').textContent = 'Loading...';
      $('episodesList').innerHTML = '';

      try {
        const resp = await fetch(`/api/series/${encodeURIComponent(name)}`);
        const data = await resp.json();
        if (data.status !== 'ok') {
          $('detailTitle').textContent = 'Series not found';
          return;
        }
        currentSeries = data;

        // Banner
        if (data.banner_image) {
          $('detailBannerImg').src = data.banner_image;
          $('detailBannerImg').style.display = '';
        } else if (data.cover_image) {
          $('detailBannerImg').src = data.cover_image;
          $('detailBannerImg').style.display = '';
        } else {
          $('detailBannerImg').style.display = 'none';
        }

        // Poster
        $('detailPoster').src = data.cover_image || '';
        $('detailPoster').style.display = data.cover_image ? '' : 'none';

        // Info
        $('detailTitle').textContent = data.display_title || data.series;
        $('detailSynopsis').textContent = data.description || 'No synopsis available for this title.';

        // Meta tags
        const tags = [];
        if (data.year) tags.push(`<span class="detail-tag">${data.year}</span>`);
        if (data.score) tags.push(`<span class="detail-tag">${(data.score/10).toFixed(1)} / 10</span>`);
        if (data.anilist_status) tags.push(`<span class="detail-stat">${data.anilist_status.replace('_',' ')}</span>`);
        (data.genres || []).forEach(g => tags.push(`<span class="detail-tag">${esc(g)}</span>`));
        if (data.total_episodes_anilist) tags.push(`<span class="detail-stat">${data.total_episodes_anilist} episodes (AniList)</span>`);
        $('detailMeta').innerHTML = tags.join('');

        // Episode count
        $('detailEpCount').textContent = data.total_episodes + ' in vault';

        // Play button
        if (data.episodes.length > 0) {
          $('detailPlayBtn').style.display = '';
          $('detailPlayBtn').onclick = () => navigate(`#/watch/${data.episodes[0].id}/${encodeURIComponent(data.series)}`);
        } else {
          $('detailPlayBtn').style.display = 'none';
        }

        // Telegram link
        $('detailTgLink').href = `https://t.me/NakamaNetworkbot?start=search_${encodeURIComponent(data.series)}`;

        // Episode rows
        $('episodesList').innerHTML = data.episodes.map((ep, idx) => {
          const epLabel = ep.episode !== null ? ep.episode : (idx + 1);
          return `
            <div class="episode-row" onclick="navigate('#/watch/${ep.id}/${encodeURIComponent(data.series)}')">
              <div class="episode-row-left">
                <span class="episode-num mono">${epLabel}</span>
                <span class="episode-name truncate">${esc(ep.file_name)}</span>
              </div>
              <div class="episode-row-right">
                <span class="episode-size mono">${ep.size_human}</span>
                <button class="episode-play-btn" onclick="event.stopPropagation(); navigate('#/watch/${ep.id}/${encodeURIComponent(data.series)}')">Play</button>
                <a class="episode-dl-btn" href="https://t.me/NakamaNetworkbot?start=file_${ep.id}" target="_blank" onclick="event.stopPropagation()">Download</a>
              </div>
            </div>`;
        }).join('');

      } catch (e) {
        $('detailTitle').textContent = 'Error loading series';
      }
    }

    // --- Watch / Playback ---

    function startPlayback(fileId, seriesName) {
      $('watchSource').src = `/stream/${fileId}`;
      $('watchVideo').load();
      $('watchVideo').play().catch(() => {});
      $('watchTgBtn').href = `https://t.me/NakamaNetworkbot?start=file_${fileId}`;

      // Find episode info from currentSeries
      if (currentSeries && currentSeries.episodes) {
        const idx = currentSeries.episodes.findIndex(e => e.id === fileId);
        if (idx >= 0) {
          const ep = currentSeries.episodes[idx];
          $('watchTitle').textContent = ep.file_name;

          // Prev / Next
          $('watchPrev').disabled = idx === 0;
          $('watchNext').disabled = idx >= currentSeries.episodes.length - 1;
          $('watchPrev').onclick = () => {
            if (idx > 0) navigate(`#/watch/${currentSeries.episodes[idx-1].id}/${encodeURIComponent(currentSeries.series)}`);
          };
          $('watchNext').onclick = () => {
            if (idx < currentSeries.episodes.length - 1) navigate(`#/watch/${currentSeries.episodes[idx+1].id}/${encodeURIComponent(currentSeries.series)}`);
          };
        } else {
          $('watchTitle').textContent = `File #${fileId}`;
        }
      } else {
        $('watchTitle').textContent = `File #${fileId}`;
        $('watchPrev').disabled = true;
        $('watchNext').disabled = true;
      }

      // Series back link
      if (seriesName) {
        $('watchSeriesLink').innerHTML = `<span style="color:var(--accent); cursor:pointer;">&larr; Back to ${esc(seriesName)}</span>`;
        $('watchSeriesLink').onclick = () => navigate(`#/anime/${encodeURIComponent(seriesName)}`);
      } else {
        $('watchSeriesLink').innerHTML = '';
      }
    }

    // --- Search ---

    let searchTimer;
    $('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      const q = e.target.value.trim();
      searchTimer = setTimeout(() => {
        if (q.length >= 2) {
          navigate(`#/search/${encodeURIComponent(q)}`);
        } else if (q.length === 0) {
          navigate('#/');
        }
      }, 350);
    });

    async function runSearch(query) {
      $('searchQuery').textContent = `"${query}"`;
      $('searchResults').innerHTML = '<div class="empty-state">Searching...</div>';

      // First search locally in cached catalog
      const localResults = catalog.filter(i =>
        i.name.toLowerCase().includes(query.toLowerCase()) ||
        (i.display_title && i.display_title.toLowerCase().includes(query.toLowerCase()))
      );

      if (localResults.length > 0) {
        $('searchResults').innerHTML = localResults.map(posterCardHtml).join('');
      } else {
        $('searchResults').innerHTML = '<div class="empty-state">No results found for this query.</div>';
      }
    }

    // Keyboard: / to focus search, Escape to go home
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        $('searchInput').focus();
      }
      if (e.key === 'Escape') {
        $('searchInput').blur();
        $('searchInput').value = '';
        navigate('#/');
      }
    });

    // --- Helpers ---
    function esc(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>

services:
  # ─── Nakama Web Streaming Gateway & SPA ────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "server.app"]
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    volumes:
      - nakama_data:/data

  # ─── Nakama Telegram Bot ───────────────────────────────────────────────────
  bot:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "bot"]
    env_file:
      - .env
    volumes:
      - nakama_data:/data

  # ─── SubsPlease RSS Ingest Worker (optional) ─────────────────────────────────
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "worker.rss_sub_bot"]
    env_file:
      - .env
    volumes:
      - nakama_data:/data
    profiles:
      - ingest

volumes:
  nakama_data:
